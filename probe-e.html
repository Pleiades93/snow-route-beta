<style>
html, body { margin: 0; padding: 0; height: 100%; height: 100dvh; overflow: hidden; background: #14171d; }
html { min-height: min(100lvh, calc(100% + env(safe-area-inset-top))); }
body { font-family: -apple-system, system-ui, sans-serif; }
#splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#splashBg { position: absolute; inset: -70px 0; background: #2b4bf2; } /* Beta 1.65: the cover overshoots the screen top and bottom by 70px, so while the screen size is still settling in the first frames no sliver of the app beneath (the tab bar) can show under the splash */
#splashIcon { position: relative; width: 168px; height: 168px; border-radius: 38px; box-shadow: 0 18px 50px rgba(0,0,0,.35); will-change: transform; }
#splashTitle { position: relative; margin-top: 26px; color: #fff; font-size: 37px; font-weight: 700; letter-spacing: .2px; opacity: 0; animation: splashSlide .65s cubic-bezier(.16,.84,.3,1) .1s forwards; }
@keyframes splashSlide { 0% { opacity: 0; transform: translateX(360px); } 55% { opacity: 1; } 82% { transform: translateX(-9px); } 100% { opacity: 1; transform: translateX(0); } }
#splash.go #splashIcon { animation: splashRush .85s cubic-bezier(.5,0,.85,.35) forwards; box-shadow: none; }
#splash.go #splashBg { animation: splashBgOut .85s linear forwards; }
#splash.go #splashTitle { animation: splashTitleOut .3s linear forwards; }
@keyframes splashRush { 0% { opacity: 1; transform: scale(1); } 88% { opacity: 1; transform: scale(60); } 100% { opacity: 0; transform: scale(66); } }
@keyframes splashBgOut { 0%, 82% { opacity: 1; } 100% { opacity: 0; } }
@keyframes splashTitleOut { to { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #splash { display: none; } }
#behind { position: fixed; inset: 0; background: #14171d; color: #e8ecf1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
#behind h1 { font-size: 26px; margin: 0; }
#behind p { font-size: 16px; color: #9fb0c3; margin: 0; line-height: 1.45; }
</style></head>
<body>
<div id="splash"><div id="splashBg"></div><img id="splashIcon" src="icon-512.png" alt=""><div id="splashTitle">Snow Route</div></div>
<div id="behind"><h1>Probe E</h1><p>BLANK launch photo - the blue startup image has NO icon in it; the live splash animation is unchanged.</p><p>Loaded at <span id="t"></span></p></div>
<script>
document.getElementById('t').textContent = new Date().toLocaleTimeString();
window.addEventListener('load', () => setTimeout(() => {
  const sp = document.getElementById('splash');
  sp.classList.add('go');
  setTimeout(() => sp.remove(), 1050);
}, 1900));
</script>
</body></html>

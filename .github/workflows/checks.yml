# Beta 1.96 (audit F-08): every action is pinned to the exact commit SHA of its release tag (the tag is kept as a trailing comment). A tag can be re-pointed by its owner; a SHA cannot - the workflow runs exactly the code reviewed when the pin was set. Bump deliberately: resolve the new tag to its commit via the GitHub API and update SHA + comment together.
name: checks
# Beta 1.83 (CI-speed round, Andrew approved after the professional-practice
# research): the browser drives run in parallel shards, balanced by
# measured duration, instead of one serial job. Beta 1.136 (programme E):
# the shard lists below are GENERATED by scripts/gen-shards.py from the
# ALL list in tests/browser/run.mjs + the measured durations in
# scripts/shard-durations.json - never hand-edit them; re-measure, then
# re-run the generator.
# Test-suite restructure (2026-11-09, Andrew approved): EIGHT shards, and
# TIERED gates replace the full battery on every push. A plan job diffs
# the change and scripts/select-tier.py applies the written map in
# tests/TIER-MAP.md (operative table: tests/tier-map.json): Tier A
# (visual/constant/copy) = build-and-test + a named core set; Tier B
# (feature work) = build-and-test + the touched surface's drive family;
# Tier C (deep mechanics, the test machinery itself) = the full battery
# + offline-e2e. Quarantined drives (tests/quarantine.json) do not gate
# tiers A/B until hardened. The FLAKE RULE: classify APP/TEST/FLAKE; a
# flake gets ONE focused re-run of that drive/family only - whole-battery
# re-runs are abolished; a second flake quarantines the drive.
# Every job also carries a timeout-minutes cap (Beta 1.136): through
# 1.135 a hung job ran to GitHub's 6-hour default before anyone knew.
# A push to main runs the Tier A core set (the browser-smoke job): the
# merge gate is the tree-identity proof (the merged tree must equal the
# tested branch tree - verified at merge time, see
# DEVELOPMENT_RULES.md), the build checks below, and the live
# read-back; if the trees ever differ, the full suite is re-run via
# workflow_dispatch before the round is called shipped. The nightly
# full battery on main is dispatched by Muse's 1 AM job - the
# environment-drift audit a tree hash cannot see (runner/browser
# changes). scripts/check-shard-coverage.py runs in build-and-test and
# fails the build if the shard lists ever stop covering every drive in
# run.mjs exactly once.
on:
  # Gate hardening (2026-11-12, Andrew approved): the push trigger is
  # scoped to main ONLY. A push to a pull-request branch used to fire a
  # second, competing run for the same head commit: the fixed-name
  # "tier drives" aggregator below (tier-drives-gate) runs only on
  # pull_request events, so in the push run it was skipped - and GitHub
  # counts a skipped required check as passing, whichever event produced
  # the verdict (PR #13 auto-merged ~10 minutes before its real battery
  # finished). With branch pushes firing no run at all, the
  # pull_request run is the ONLY source of the required checks for a PR
  # head. Push-to-main (post-merge smoke) and workflow_dispatch (the
  # nightly battery) are unchanged.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: 'Gate tier: full (default) = Tier C battery + offline-e2e; A/B/C force a tier; auto decides from the diff vs main'
        type: choice
        options: [full, auto, A, B, C]
        default: full
permissions:
  contents: read # Beta 1.94 (audit F-08): the workflow only checks out and tests - it never needs write access to the repository
concurrency:
  # Branch/PR runs cancel superseded runs on the same ref; main runs never
  # cancel each other (unique group per run).
  group: ${{ github.ref == 'refs/heads/main' && format('checks-main-{0}', github.run_id) || format('checks-{0}', github.ref) }}
  cancel-in-progress: true
jobs:
  plan:
    # Tier selection (test-suite restructure, 2026-11-09): diffs the change
    # and applies the written map (tests/TIER-MAP.md) via
    # scripts/select-tier.py. Schedule and a default manual dispatch are
    # Tier C (the nightly provenance flow is unchanged); a push to main is
    # Tier A (the browser-smoke job runs the core set); everything else is
    # decided by the paths the change touches.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      drives: ${{ steps.plan.outputs.drives }}
      offline: ${{ steps.plan.outputs.offline }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Plan (tier selection by the written map, tests/TIER-MAP.md)
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          REF: ${{ github.ref }}
          FORCE: ${{ inputs.tier }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            python3 scripts/select-tier.py --files /dev/null --force C --github-output
          elif [ -n "$FORCE" ] && [ "$FORCE" != "auto" ]; then
            F="$FORCE"; [ "$F" = "full" ] && F="C"
            python3 scripts/select-tier.py --files /dev/null --force "$F" --github-output
          elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            python3 scripts/select-tier.py --files /dev/null --force A --github-output
          elif [ "$EVENT" = "pull_request" ]; then
            git diff --name-only "$BASE...$AFTER" > /tmp/changed.txt
            python3 scripts/select-tier.py --files /tmp/changed.txt --github-output
          else
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              git diff --name-only "$BEFORE" "$AFTER" > /tmp/changed.txt
            else
              git fetch --no-tags origin main >/dev/null 2>&1 || true
              git diff --name-only origin/main...HEAD > /tmp/changed.txt || git diff --name-only HEAD~1 > /tmp/changed.txt
            fi
            python3 scripts/select-tier.py --files /tmp/changed.txt --github-output
          fi
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build check (generated files match source; parity + integrity)
        run: python3 scripts/build-pages.py --check
      - name: Shard coverage (every drive in exactly one shard)
        run: python3 scripts/check-shard-coverage.py
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Type check (A1 pilot - parts/app1.js only, Beta 1.149)
        working-directory: scripts
        run: |
          npm ci
          ./node_modules/.bin/tsc -p tsconfig.json
      - name: Service worker tests
        run: node tests/sw.test.mjs
      - name: Trail segmentation fixtures (test-change gate)
        run: node tests/browser/selftest-trail-segments.mjs
      - name: Storage-outcome contract fixtures (Phase 3 gate)
        run: node tests/browser/selftest-store-result.mjs
      - name: Transaction coordinator fixtures (Phase 4 gate)
        run: node tests/browser/selftest-tx.mjs
      - name: History retention fixtures (round 103 gate; cap retired Beta 1.167)
        run: node tests/browser/selftest-history.mjs
      - name: Round-112 honesty fixtures (round 112 gate)
        run: node tests/browser/selftest-round112.mjs
      - name: Offline contract fixture (Phase 5 gate)
        run: node tests/browser/selftest-offline-fixture.mjs
      - name: Service-worker contract literals (Phase 5 gate)
        run: node tests/browser/selftest-sw-contract.mjs
      - name: Engine host surface (Phase 6 gate)
        run: node tests/browser/selftest-engine-surface.mjs
      - name: CSP connect-src hosts (Beta 1.119 gate)
        run: node tests/browser/selftest-csp-connect-src.mjs
      - name: Pack-field list fixtures (Beta 1.131 gate)
        run: node tests/browser/selftest-packfields.mjs
      - name: Page-expression syntax gate (Tranche 1 gate)
        run: node tests/browser/selftest-ev-syntax.mjs
      - name: Boot-readiness assertion fixtures (Tranche 1 gate)
        run: node tests/browser/selftest-readiness.mjs
      - name: Judging-logic fixtures (Tranche 2 gate)
        run: node tests/browser/selftest-judging-fixtures.mjs
      - name: Foreign-write census (Tranche 2 gate)
        run: node tests/browser/selftest-foreign-writes.mjs
      - name: NV fix round proofs (Beta 1.152 - stretch parity, pack ceilings, tile budget; history cap retired Beta 1.167)
        run: node tests/browser/selftest-nv1152.mjs
      - name: Premise-lint fixtures (Tranche 4 gate)
        run: python3 scripts/premise-lint-fixtures/run-fixtures.py
      - name: Bug-hunt fix fixtures (PR #23 gate; Beta 1.185)
        run: node tests/browser/selftest-pr23-fixes.mjs
      - name: Tier selector fixtures (PR #23 gate; Beta 1.185)
        run: python3 scripts/select-tier-fixtures/run-fixtures.py
      - name: Premise lint (advisory - drive premises this PR's app diff touches)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
          git diff ${{ github.event.pull_request.base.sha }} -- parts/ > /tmp/pr-premise.diff
          python3 scripts/premise-lint.py --diff /tmp/pr-premise.diff
  browser-tests:
    # Tier C: the full battery. Runs everywhere the plan selects Tier C
    # EXCEPT a push to main (the smoke job takes that; a main push plans
    # Tier A in any case). The nightly schedule plans Tier C, so the
    # nightly full battery on main is unchanged.
    needs: plan
    if: needs.plan.outputs.tier == 'C' && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
    name: browser-tests shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            drives: "drive142 drive151 drive166 drive175 drive176 drive177 drive187"
          - shard: 2
            drives: "drive114 drive117 drive127 drive140 drive145 drive155 drive190 drive89"
          - shard: 3
            drives: "drive133 drive147 drive148 drive162 drive165 drive168 drive180 drive182 drive186 drive86"
          - shard: 4
            drives: "drive116 drive118 drive120 drive131 drive153 drive154 drive160 drive171 drive184 drive192"
          - shard: 5
            drives: "drive123 drive130 drive136 drive163 drive164 drive172 drive173 drive188 drive88"
          - shard: 6
            drives: "drive124 drive125 drive129 drive135 drive149 drive150 drive152 drive185 drive83"
          - shard: 7
            drives: "drive121 drive126 drive132 drive143 drive156 drive159 drive169 drive178 drive189"
          - shard: 8
            drives: "drive115 drive128 drive141 drive146 drive161 drive170 drive174 drive181 drive183 drive191"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Locate Chrome
        run: echo "CHROME_BIN=$(command -v google-chrome || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"
      - name: "Runner self-test (verdicts: exit code, timeout, result block)"
        run: node tests/browser/selftest-runner.mjs
      - name: "Cleanup self-test (orphan browsers: throw + timeout paths)"
        run: node tests/browser/selftest-cleanup.mjs
      - name: "Scenario-layer fixtures (Tranche 4 gate)"
        run: node tests/browser/selftest-scenario.mjs
      - name: Browser tests (deterministic drives, shard ${{ matrix.shard }})
        run: node tests/browser/run.mjs ${{ matrix.drives }}
  tier-drives:
    # Tier A (core set) and Tier B (the touched surface's family) gates on
    # branches and PRs. A push to main is excluded: the browser-smoke job
    # runs the same Tier A core set there.
    needs: plan
    if: (needs.plan.outputs.tier == 'A' || needs.plan.outputs.tier == 'B') && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
    name: tier drives (${{ needs.plan.outputs.tier }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Locate Chrome
        run: echo "CHROME_BIN=$(command -v google-chrome || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"
      - name: "Runner self-test (verdicts: exit code, timeout, result block)"
        run: node tests/browser/selftest-runner.mjs
      - name: "Cleanup self-test (orphan browsers: throw + timeout paths)"
        run: node tests/browser/selftest-cleanup.mjs
      - name: "Scenario-layer fixtures (Tranche 4 gate)"
        run: node tests/browser/selftest-scenario.mjs
      - name: Tier drives (${{ needs.plan.outputs.tier }} - ${{ needs.plan.outputs.drives }})
        run: node tests/browser/run.mjs ${{ needs.plan.outputs.drives }}
  browser-smoke:
    # Push to main (i.e. a merge landing): the Tier A core set only
    # (tests/TIER-MAP.md) - drive180 mandatory; drive89 excluded while
    # quarantined; drive123 and drive145 left the fast gate in the
    # 2026-11-09 restructure. The branch gate already ran the tier the
    # change required on the identical tree.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Locate Chrome
        run: echo "CHROME_BIN=$(command -v google-chrome || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"
      - name: "Runner self-test (verdicts: exit code, timeout, result block)"
        run: node tests/browser/selftest-runner.mjs
      - name: "Cleanup self-test (orphan browsers: throw + timeout paths)"
        run: node tests/browser/selftest-cleanup.mjs
      - name: "Scenario-layer fixtures (Tranche 4 gate)"
        run: node tests/browser/selftest-scenario.mjs
      - name: Browser smoke (Tier A core set)
        run: node tests/browser/run.mjs drive131 drive160 drive161 drive168 drive174 drive180
  offline-e2e:
    # Tier C and nightly only (test-suite restructure, 2026-11-09): the
    # service-worker shell does not change on every ship - see the finding
    # in tests/TIER-MAP.md. The plan job flags offline=true exactly for
    # Tier C (which the nightly schedule and a default dispatch select).
    needs: plan
    if: needs.plan.outputs.offline == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Locate Chrome
        run: echo "CHROME_BIN=$(command -v google-chrome || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"
      - name: Race-judge self-test (E17 retry predicate, fixture-proven before it judges)
        run: node tests/browser/selftest-race-loss.mjs
      - name: Offline end-to-end (real service worker, real caches; Beta 1.53 / audit B08)
        run: |
          python3 -m http.server 8077 --directory . >/dev/null 2>&1 &
          sleep 1
          node tests/browser/e2e-offline.mjs
  tier-drives-gate:
    # Audit gate (2026-11-11, Andrew approved): fixed-name aggregate of the
    # drive gates. The tier job's own check name carries a variable tier
    # suffix ("tier drives (A)"), so branch protection cannot require it.
    # This job reports the drive-gate verdict under ONE fixed name -
    # "tier drives" - on pull requests: it passes only when the drive gate
    # that ran for the selected tier passed (tier-drives for Tier A/B, the
    # browser-tests shards for Tier C), and fails when either drive job
    # failed or was cancelled, or when neither ran (plan anomaly - fail
    # closed). On push / workflow_dispatch events it is skipped by
    # condition, so main pushes (browser-smoke reports there) and the
    # nightly battery (shards report there) are completely untouched.
    name: tier drives
    needs: [tier-drives, browser-tests]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate drive-gate verdict
        env:
          TIER_RESULT: ${{ needs.tier-drives.result }}
          SHARDS_RESULT: ${{ needs.browser-tests.result }}
        run: |
          echo "tier-drives result: ${TIER_RESULT}"
          echo "browser-tests (Tier C shards) result: ${SHARDS_RESULT}"
          if [ "${TIER_RESULT}" = "failure" ] || [ "${TIER_RESULT}" = "cancelled" ] || [ "${SHARDS_RESULT}" = "failure" ] || [ "${SHARDS_RESULT}" = "cancelled" ]; then
            echo "::error::A drive gate failed or was cancelled."
            exit 1
          fi
          if [ "${TIER_RESULT}" = "success" ] || [ "${SHARDS_RESULT}" = "success" ]; then
            echo "Drive gate passed."
            exit 0
          fi
          echo "::error::Neither drive gate ran on this pull request - failing closed."
          exit 1

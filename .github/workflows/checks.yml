# Beta 1.96 (audit F-08): every action is pinned to the exact commit SHA of its release tag (the tag is kept as a trailing comment). A tag can be re-pointed by its owner; a SHA cannot - the workflow runs exactly the code reviewed when the pin was set. Bump deliberately: resolve the new tag to its commit via the GitHub API and update SHA + comment together.
name: checks
# Beta 1.83 (CI-speed round, Andrew approved after the professional-practice
# research): the browser drives run in parallel shards, balanced by
# measured duration, instead of one serial job. Beta 1.136 (programme E):
# the shard lists were GENERATED by scripts/gen-shards.py from the
# ALL list in tests/browser/run.mjs + the measured durations in
# scripts/shard-durations.json. Testing-efficiency rollout (2026-11-23):
# the lists are GONE - each shard job runs `run.mjs --shard N` and the
# runner computes its share at runtime from shard-durations.json under
# the same partition rule (scripts/gen-shards.py is its statement;
# scripts/check-shard-coverage.py proves coverage and agreement).
# Test-suite restructure (2026-11-09, Andrew approved): EIGHT shards, and
# TIERED gates replace the full battery on every push. A plan job diffs
# the change and scripts/select-tier.py applies the written map in
# tests/TIER-MAP.md (operative table: tests/tier-map.json): Tier A
# (visual/constant/copy) = build-and-test + a named core set; Tier B
# (feature work) = build-and-test + the touched surface's drive family;
# Tier C (deep mechanics, the test machinery itself) = the full battery
# + offline-e2e. Quarantined drives (tests/quarantine.json) do not gate
# tiers A/B until hardened. The FLAKE RULE: classify APP/TEST/FLAKE; a
# flake gets ONE focused re-run of that drive/family only - whole-battery
# re-runs are abolished; a second flake quarantines the drive. 7c
# extension (2026-11-25): a round that burns more than 2 gate attempts
# on adjudicated flakes owes a harness investigation inside that same
# round - the flake census and the fix, not another re-run.
# Every job also carries a timeout-minutes cap (Beta 1.136): through
# 1.135 a hung job ran to GitHub's 6-hour default before anyone knew.
# A push to main runs the Tier A core set (the browser-smoke job): the
# merge gate is the tree-identity proof (the merged tree must equal the
# tested branch tree - verified at merge time, see
# DEVELOPMENT_RULES.md), the build checks below, and the live
# read-back; if the trees ever differ, the full suite is re-run via
# workflow_dispatch before the round is called shipped. The nightly
# full battery on main is dispatched by Muse's 1 AM job - the
# environment-drift audit a tree hash cannot see (runner/browser
# changes). scripts/check-shard-coverage.py runs in build-and-test and
# fails the build if the runtime shard partition ever stops covering
# every drive on disk exactly once.
# Protocol fix round (2026-11-17, Andrew approved): the plan job FAILS
# any workflow_dispatch on a ref other than main (the skipped-check
# hole through the dispatch door - see the plan job); Tier B selections
# union the core set; a touched drive always runs, quarantined or not;
# proofs run from tests/proof/manifest.json in build-and-test (no
# per-proof steps - registering a proof no longer edits this file);
# the tier-map and proof-coverage guards run in build-and-test; and
# build-and-test proves parts/pmstyles.js regenerates byte-identical.
# Testing-efficiency rollout (2026-11-23, Andrew's decision): THE TIERS
# ARE RETIRED - the paragraphs above are the historical record of the
# tiered era. Every pull request now runs the full battery; the plan job
# only routes by event; scripts/select-tier.py, tests/tier-map.json,
# tests/TIER-MAP.md and tests/quarantine.json are deleted, and the
# tier-map guard with them (the roster-completeness claim it carried
# lives on in scripts/check-shard-coverage.py). The FLAKE RULE stated
# above STANDS unchanged. The proof roster is likewise generated:
# scripts/run-proofs.py runs every proof on disk except the manifest's
# retired-with-reason list.
# Issue #178 (machinery-issues round, 2026-11-23): build-and-test also
# enforces the push.py receipts, census and mirrors gates (the steps
# right after Build check below), so the pull-request gate no longer
# depends on the change having arrived via the wrapper. The registry
# gate runs here too: the fix-checks registry is vendored into the
# repo (hidden_files/fix-checks.json, generated by
# scripts/sync-fix-checks.py from the canonical goal-side registry;
# Andrew's ruling, 2026-11-23) and the repo-pinned subset runs as
# the Registry gate step below.
on:
  # Gate hardening (2026-11-12, Andrew approved): the push trigger is
  # scoped to main ONLY. A push to a pull-request branch used to fire a
  # second, competing run for the same head commit: the fixed-name
  # "tier drives" aggregator below (tier-drives-gate) runs only on
  # pull_request events, so in the push run it was skipped - and GitHub
  # counts a skipped required check as passing, whichever event produced
  # the verdict (PR #13 auto-merged ~10 minutes before its real battery
  # finished). With branch pushes firing no run at all, the
  # pull_request run is the ONLY source of the required checks for a PR
  # head. Push-to-main (post-merge smoke) and workflow_dispatch (the
  # nightly battery) are unchanged.
  push:
    branches: [main]
  pull_request:
  # Merge-queue readiness (testing-efficiency rollout, 2026-11-23): the
  # workflow answers merge_group events so the queue CAN be enabled
  # without a further workflow change - the plan job flags the full
  # battery for a queue entry and the "tier drives" aggregator reports
  # on it. The queue itself is NOT enabled by this round: the codex
  # review gate cannot post on queue commits (its bridge runs on
  # pull_request_target and judges PR heads), so a queue requiring it
  # could never merge, and a queue not requiring it would weaken a
  # locked gate. See the rollout RECORD for the follow-up shape.
  merge_group:
  workflow_dispatch:
    inputs:
      full:
        description: 'Full battery (default) = every drive shard + offline-e2e; false = build checks only. (Replaces the retired tier input - tier selection was removed by the testing-efficiency rollout, 2026-11-23.)'
        type: boolean
        default: true
permissions:
  contents: read # Beta 1.94 (audit F-08): the workflow only checks out and tests - it never needs write access to the repository
  issues: read # the PR limits step reads the PR's labels live at run time (test-efficiency stage 3)
concurrency:
  # Branch/PR runs cancel superseded runs on the same ref; main runs never
  # cancel each other (unique group per run).
  group: ${{ github.ref == 'refs/heads/main' && format('checks-main-{0}', github.run_id) || format('checks-{0}', github.ref) }}
  cancel-in-progress: true
jobs:
  plan:
    # The plan (testing-efficiency rollout, 2026-11-23): there is NO tier
    # selection anymore - Andrew's decision dropped the tiers, so every
    # pull request runs the FULL battery (all drive shards + offline-e2e)
    # and this job only routes by event: a push to main is covered by the
    # browser-smoke job; a workflow_dispatch on main runs the full battery
    # unless its `full` input is false (the nightly battery uses the
    # default). scripts/select-tier.py, tests/tier-map.json and
    # tests/TIER-MAP.md are deleted with the tiers. Protocol fix round
    # (2026-11-17) rule KEPT: a workflow_dispatch on any ref other than
    # main FAILS in this job by design - on a pull-request branch its
    # fixed-name "tier drives" aggregator would be skipped, and GitHub
    # counts a skipped required check as passing (the hole class closed
    # for branch pushes on 2026-11-12, through the dispatch door).
    # Failing here posts a red required check on that head instead.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      drives: ${{ steps.plan.outputs.drives }}
      offline: ${{ steps.plan.outputs.offline }}
    steps:
      - name: Plan (full battery on every PR - tier selection retired)
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          FULL: ${{ inputs.full }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::workflow_dispatch is only allowed on main (got $REF). A manual run on a pull-request branch posts a skipped 'tier drives' check on that head, and GitHub counts a skipped required check as passing - this job fails instead, so the run posts a red required check (protocol fix round, 2026-11-17)."
            exit 1
          fi
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "merge_group" ]; then
            echo "drives=true" >> "$GITHUB_OUTPUT"
            echo "offline=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$FULL" = "false" ]; then
            echo "drives=false" >> "$GITHUB_OUTPUT"
            echo "offline=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            echo "drives=true" >> "$GITHUB_OUTPUT"
            echo "offline=true" >> "$GITHUB_OUTPUT"
          else
            echo "drives=false" >> "$GITHUB_OUTPUT"
            echo "offline=false" >> "$GITHUB_OUTPUT"
          fi
  build-and-test:
    # PREFLIGHT (testing-efficiency rollout, 2026-11-23): this job is the
    # cheap-checks gate the drive jobs wait on (browser-tests,
    # browser-smoke and offline-e2e all `needs` it) - build check, coverage
    # guards, tsc, the selftests and the proofs run ONCE here instead of
    # racing the shards. It keeps the name build-and-test because branch
    # protection requires a check of exactly that name; renaming the job
    # would leave the required check unposted and every PR unmergeable.
    # The three runner self-tests (runner, cleanup, scenario) moved here
    # from the drive jobs in the same round: they prove the harness, not
    # the app, and running them in every shard only multiplied their cost.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (node24 runtime; issue #180 - the v4 pins declare node20)
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Generate assembled source (generated, never tracked)
        run: python3 scripts/assemble.py
      - name: Build check (generated files match source; parity + integrity)
        run: python3 scripts/build-pages.py --check
      - name: Collect changed paths (event base tree against head tree)
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "No event diff for workflow_dispatch."
            exit 0
          fi
          if [ "$EVENT" = "push" ] && [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git hash-object -t tree -w --stdin </dev/null)
          elif ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          changed_files=$(mktemp "$GITHUB_WORKSPACE/.changed-files.XXXXXX")
          # Keep both sides of a rename, as in push.py's blob-map comparison.
          git diff --name-only --no-renames -z "$BASE_SHA" HEAD -- > "$changed_files"
          echo "CHANGED_FILES=$changed_files" >> "$GITHUB_ENV"
      - name: PR limits (size, comment, line and root rules; warn-only scope and fix-up rules)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PAYLOAD_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # Labels read live: a mid-round label counts on re-runs.
          PR_LABELS=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '[.[].name] | join(",")' 2>/dev/null || echo "$PAYLOAD_LABELS")
          python3 scripts/check-pr-limits.py . --base "$BASE_SHA" --labels "$PR_LABELS"
      - name: Receipts gate (refuse changed checks without current mutation receipts, class N1)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Receipts gate skipped: workflow_dispatch has no event diff."
            exit 0
          fi
          mapfile -d '' -t changed < "$CHANGED_FILES"
          if [ "${#changed[@]}" -gt 0 ]; then
            python3 scripts/check-receipts.py gate . --changed "${changed[@]}"
          fi
      - name: Census gate (refuse parts changes without a current sibling census, class N2)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Census gate skipped: workflow_dispatch has no event diff."
            exit 0
          fi
          mapfile -d '' -t changed < "$CHANGED_FILES"
          if [ "${#changed[@]}" -gt 0 ]; then
            python3 scripts/check-census.py gate . --changed "${changed[@]}"
          fi
      - name: Survivors gate (refuse parts changes without a current survivor list, Class 2)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Survivors gate skipped: workflow_dispatch has no event diff."
            exit 0
          fi
          mapfile -d '' -t changed < "$CHANGED_FILES"
          if [ "${#changed[@]}" -gt 0 ]; then
            python3 scripts/check-survivors.py gate . --changed "${changed[@]}"
          fi
      - name: Mirrors gate (refuse drift from mirror sources, class C4)
        run: python3 scripts/check-mirrors.py .
      - name: Guidelines sync (vendored Codex review guidelines match their canonical copy)
        run: python3 scripts/sync-guidelines.py --check
      - name: Registry gate (repo-pinned fix-checks subset, issue #178)
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/sync-fix-checks.py --check-internal .
          python3 scripts/run_fix_checks.py .
      - name: Share the built page (one build of record per run)
        # Testing-efficiency rollout (2026-11-23): the build check above has
        # just proven the committed index.html byte-identical to a fresh
        # build, so this artifact IS the run's one build, kept for anything
        # downstream that needs the built page. The drive shards use the
        # committed copy (the same bytes, parity-proven) rather than paying
        # a download per shard - the report measured that saving at <30 s
        # and it is not worth a per-shard failure mode.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: built-page
          path: index.html
          if-no-files-found: error
      - name: Shard coverage (every drive in exactly one shard)
        run: python3 scripts/check-shard-coverage.py
      - name: Proof coverage (every proof gate-run or retired with a reason)
        run: python3 scripts/check-proof-coverage.py
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 (node24 runtime; issue #180)
        with:
          node-version: '22'
          # Testing-efficiency rollout (2026-11-23): cache the npm downloads
          # the tsc step's `npm ci` in scripts/ would otherwise fetch fresh
          # every run (keyed on the pinned lockfile). Chrome needs no cache:
          # the shards use the runner image's preinstalled browser.
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json
      - name: Type check (all parts but app3.js; noImplicitAny on - scope in scripts/tsconfig.json)
        working-directory: scripts
        run: |
          npm ci
          ./node_modules/.bin/tsc -p tsconfig.json
      - name: Strict-null check (storage files clean; global backlog capped)
        run: python3 scripts/check-snc.py .
      - name: Parts scan (write outcomes, clones, labelpts ownership, boundaries)
        run: node scripts/scan-parts.cjs .
      - name: Boundary scanner fixtures (G-B gate)
        run: node tests/boundary-fixtures.cjs
      - name: ESLint (standard JS rules beside the bespoke scanners)
        run: npm exec --yes --package=eslint@9.39.1 -- eslint 'parts/*.js' '{scripts,tests}/**/*.{js,cjs,mjs}'
      - name: Basemap style parity (parts/pmstyles.js is generated - regeneration must be byte-identical)
        working-directory: scripts
        run: |
          node genstyles.mjs
          git -C "$GITHUB_WORKSPACE" diff --exit-code -- parts/pmstyles.js
      - name: Service worker tests
        run: node tests/sw.test.mjs
      - name: "Runner self-test (verdicts: exit code, timeout, result block)"
        run: node tests/browser/selftest-runner.mjs
      - name: "Cleanup self-test (orphan browsers: throw + timeout paths)"
        run: node tests/browser/selftest-cleanup.mjs
      - name: "Scenario-layer fixtures (Tranche 4 gate)"
        run: node tests/browser/selftest-scenario.mjs
      - name: Trail segmentation fixtures (test-change gate)
        run: node tests/browser/selftest-trail-segments.mjs
      - name: Storage-outcome contract fixtures (Phase 3 gate)
        run: node tests/browser/selftest-store-result.mjs
      - name: Transaction coordinator fixtures (Phase 4 gate)
        run: node tests/browser/selftest-tx.mjs
      - name: History retention fixtures (round 103 gate; cap retired Beta 1.167)
        run: node tests/browser/selftest-history.mjs
      - name: Round-112 honesty fixtures (round 112 gate)
        run: node tests/browser/selftest-round112.mjs
      - name: Offline contract fixture (Phase 5 gate)
        run: node tests/browser/selftest-offline-fixture.mjs
      - name: Service-worker contract literals (Phase 5 gate)
        run: node tests/browser/selftest-sw-contract.mjs
      - name: Engine host surface (Phase 6 gate)
        run: node tests/browser/selftest-engine-surface.mjs
      - name: CSP connect-src hosts (Beta 1.119 gate)
        run: node tests/browser/selftest-csp-connect-src.mjs
      - name: Pack-field list fixtures (Beta 1.131 gate)
        run: node tests/browser/selftest-packfields.mjs
      - name: Page-expression syntax gate (Tranche 1 gate)
        run: node tests/browser/selftest-ev-syntax.mjs
      - name: Boot-readiness assertion fixtures (Tranche 1 gate)
        run: node tests/browser/selftest-readiness.mjs
      - name: Judging-logic fixtures (Tranche 2 gate)
        run: node tests/browser/selftest-judging-fixtures.mjs
      - name: Presence-lane judge fixtures (Beta 1.266 gate)
        run: node tests/browser/selftest-lane219.mjs
      - name: Foreign-write census (Tranche 2 gate)
        run: node tests/browser/selftest-foreign-writes.mjs
      - name: Route board module fixtures (Arch-2 gate)
        run: node tests/browser/selftest-board.mjs
      - name: NV fix round proofs (Beta 1.152 - stretch parity, pack ceilings, tile budget; history cap retired Beta 1.167)
        run: node tests/browser/selftest-nv1152.mjs
      - name: Proofs (manifest-driven - every proof in tests/proof/manifest.json; protocol fix round, 2026-11-17)
        run: python3 scripts/run-proofs.py
      - name: Premise-lint fixtures (Tranche 4 gate)
        run: python3 scripts/premise-lint-fixtures/run-fixtures.py
      - name: Bug-hunt fix fixtures (PR #23 gate; Beta 1.185)
        run: node tests/browser/selftest-pr23-fixes.mjs
      - name: GPS package fixtures (Beta 1.187 gate)
        run: node tests/browser/selftest-gps-package.mjs
      - name: What's New entry rules (testing-efficiency rollout, 2026-11-23 - the one home of the bullet rule the release proofs used to re-pin by hand)
        run: node tests/browser/selftest-whatsnew.mjs
      - name: Title-drop judge fixtures (drive216 amended decision C, TESTING.md rule 1 - the judge is extracted in title-drop.mjs and proven in plain Node)
        run: node tests/browser/selftest-title-drop.mjs
      - name: Gate-script verdict fixtures (protocol fix round, 2026-11-17 - the proof-coverage guard and the proof runner prove both verdicts on synthetic trees)
        run: python3 scripts/gate-fixtures/run-fixtures.py
      - name: Premise lint (blocking - drive premises this PR's app diff touches)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
          git diff ${{ github.event.pull_request.base.sha }} -- parts/ > /tmp/pr-premise.diff
          python3 scripts/premise-lint.py --diff /tmp/pr-premise.diff --strict
  browser-tests:
    # The full battery (tier selection retired by the testing-efficiency
    # rollout, 2026-11-23): runs wherever the plan flags drives - every
    # pull request and a full workflow_dispatch. A push to main never
    # flags drives (the smoke job takes that event).
    needs: [plan, build-and-test]
    if: needs.plan.outputs.drives == 'true' 
    name: browser-tests shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Testing-efficiency rollout (2026-11-23): no pasted drive lists -
        # the runner computes shard N's share at runtime from
        # scripts/shard-durations.json (run.mjs --shard N), and
        # scripts/check-shard-coverage.py proves the partition complete,
        # disjoint and in agreement with the rule's statement.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (node24 runtime; issue #180 - the v4 pins declare node20)
      - name: Generate assembled source (generated, never tracked)
        run: python3 scripts/assemble.py
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 (node24 runtime; issue #180)
        with:
          node-version: '22'
      - name: Locate Chrome
        run: echo "CHROME_BIN=$(command -v google-chrome || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"
      - name: Browser tests (deterministic drives, shard ${{ matrix.shard }})
        run: node tests/browser/run.mjs --shard ${{ matrix.shard }}
  browser-smoke:
    # Push to main (i.e. a merge landing): the smoke set only - the six
    # drives named in the step below (drive180 mandatory; drive123 and
    # drive145 left the fast gate in the 2026-11-09 restructure; the set
    # was the Tier A core set until the tiers were retired by the
    # testing-efficiency rollout, 2026-11-23, and check-shard-coverage.py
    # proves every name is a real drive). The branch gate already ran the
    # full battery on the identical tree.
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (node24 runtime; issue #180 - the v4 pins declare node20)
      - name: Generate assembled source (generated, never tracked)
        run: python3 scripts/assemble.py
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 (node24 runtime; issue #180)
        with:
          node-version: '22'
      - name: Locate Chrome
        run: echo "CHROME_BIN=$(command -v google-chrome || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"
      - name: Browser smoke (the smoke set)
        run: node tests/browser/run.mjs drive131 drive160 drive161 drive168 drive174 drive180
  offline-e2e:
    # Every pull request and the nightly dispatch (the plan flags
    # offline=true for exactly those): since the tiers were retired
    # (testing-efficiency rollout, 2026-11-23) the offline end-to-end
    # runs with the full battery instead of only on deep-mechanics
    # changes - the service-worker shell is part of what a PR can break.
    needs: [plan, build-and-test]
    if: needs.plan.outputs.offline == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (node24 runtime; issue #180 - the v4 pins declare node20)
      - name: Generate assembled source (generated, never tracked)
        run: python3 scripts/assemble.py
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 (node24 runtime; issue #180)
        with:
          node-version: '22'
      - name: Locate Chrome
        run: echo "CHROME_BIN=$(command -v google-chrome || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"
      - name: Race-judge self-test (E17 retry predicate, fixture-proven before it judges)
        run: node tests/browser/selftest-race-loss.mjs
      - name: Offline end-to-end (real service worker, real caches; Beta 1.53 / audit B08)
        run: |
          python3 -m http.server 8077 --directory . >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8077/ >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8077/ >/dev/null
          node tests/browser/e2e-offline.mjs
  tier-drives-gate:
    # Audit gate (2026-11-11, Andrew approved): fixed-name aggregate of the
    # drive gates. The tier job's own check name carries a variable tier
    # suffix ("tier drives (A)"), so branch protection cannot require it.
    # This job reports the drive-gate verdict under ONE fixed name -
    # "tier drives" - on pull requests. Since the tiers were retired
    # (testing-efficiency rollout, 2026-11-23) the aggregate is simpler
    # than the tiered form this comment used to describe: it passes only
    # when the browser-tests shards passed, fails when they failed or
    # were cancelled, and fails closed when they did not run (plan
    # anomaly). offline-e2e is in the aggregate on the same terms
    # (retro-fixes round, 2026-11-14): when the plan flags offline (every
    # PR), its failure or cancellation fails this gate; when it is
    # legitimately skipped (plan flag false), its "skipped" result is
    # ignored and the drive verdict decides. Fail-closed is preserved:
    # offline-e2e can only be skipped when its plan-flag condition is
    # false or the plan itself failed, and a failed plan skips the drive
    # job too, so the did-not-run arm below still fails the gate. On push /
    # workflow_dispatch events it is skipped by
    # condition, so main pushes (browser-smoke reports there) and the
    # nightly battery (shards report there) are completely untouched.
    name: tier drives
    needs: [browser-tests, offline-e2e]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate drive-gate verdict
        env:
          SHARDS_RESULT: ${{ needs.browser-tests.result }}
          OFFLINE_RESULT: ${{ needs.offline-e2e.result }}
        run: |
          echo "browser-tests (full-battery shards) result: ${SHARDS_RESULT}"
          echo "offline-e2e result: ${OFFLINE_RESULT}"
          if [ "${OFFLINE_RESULT}" = "failure" ] || [ "${OFFLINE_RESULT}" = "cancelled" ]; then
            echo "::error::The offline end-to-end gate failed or was cancelled."
            exit 1
          fi
          if [ "${SHARDS_RESULT}" = "failure" ] || [ "${SHARDS_RESULT}" = "cancelled" ]; then
            echo "::error::A drive gate failed or was cancelled."
            exit 1
          fi
          if [ "${SHARDS_RESULT}" = "success" ]; then
            echo "Drive gate passed."
            exit 0
          fi
          echo "::error::The drive gate did not run on this pull request - failing closed."
          exit 1

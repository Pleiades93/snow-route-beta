# Manual keyless deploy to Firebase Hosting — Snow Route (project snowroute-tracker).
#
# MANUAL ONLY: the sole trigger is workflow_dispatch. Nothing in this file
# runs when code lands on GitHub; GitHub Pages remains the channel that
# updates on every landing. This workflow publishes the current main build
# to Firebase only when a human starts it (Andrew in chat -> Muse
# dispatches it, or Andrew clicks "Run workflow" on GitHub).
#
# KEYLESS: no service-account key and no secret exists anywhere. GitHub
# issues a short-lived identity token for this one run; Google Cloud
# Workload Identity Federation exchanges it for temporary access as a
# deploy robot account that can publish Firebase Hosting and nothing else.
# The Google-side trust is restricted to this exact repository (numeric ID
# 1438991673), the main branch, and this exact workflow file — that
# restriction lives in the provider's attribute condition, set up once by
# the project owner (see beta1/work/firebase-prep/manual-deploy-setup.md
# in the workspace; it is not part of the published site).
#
# Actions are pinned to exact commit SHAs, same rule as checks.yml
# (Beta 1.96, F-08): a tag can be re-pointed; a SHA cannot.

name: Deploy to Firebase (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to publish the current main build to Firebase Hosting"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-manual-deploy
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: snowroute-tracker
  FIREBASE_PROJECT_NUMBER: "807502106914"
  FIREBASE_TOOLS_VERSION: "15.35.0"

jobs:
  deploy:
    name: Publish main to Firebase Hosting
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Confirmation and branch gate
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "Confirmation input was not DEPLOY - refusing to deploy."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Refusing to deploy from $GITHUB_REF - main only."
            exit 1
          fi
          echo "Manual Firebase deploy of $GITHUB_SHA confirmed."

      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build check (committed files match source)
        run: python3 scripts/build-pages.py --check

      - name: Stage the exact public payload
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/firebase-stage"
          mkdir -p "$stage/public/assets" "$stage/public/packs"
          cp index.html sw.js manifest.json \
             apple-touch-icon.png icon-192.png icon-512.png icon-maskable-512.png \
             "$stage/public/"
          cp -r assets/launch "$stage/public/assets/"
          cp packs/*.json "$stage/public/packs/"
          launch_count=$(find "$stage/public/assets/launch" -type f | wc -l)
          pack_count=$(find "$stage/public/packs" -type f | wc -l)
          total_count=$(find "$stage/public" -type f | wc -l)
          echo "Staged: launch=$launch_count packs=$pack_count total=$total_count"
          # The public set is exactly 32 files (7 root + 12 launch + 13 packs).
          # If the app ever gains a public file, this gate fails loudly instead
          # of silently publishing an incomplete site - update the counts here.
          test "$launch_count" -eq 12
          test "$pack_count" -eq 13
          test "$total_count" -eq 32
          sha256sum "$stage/public/index.html" | awk '{print $1}' > "$stage/expected-index.sha256"
          cat > "$stage/firebase.json" <<'JSON'
          {"hosting":{"public":"public","site":"snowroute-tracker","ignore":["firebase.json","**/.*","**/node_modules/**"]}}
          JSON
          echo "FIREBASE_STAGE=$stage" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: snowroute-tracker
          workload_identity_provider: projects/807502106914/locations/global/workloadIdentityPools/github-actions/providers/snow-route-beta
          service_account: github-firebase-deployer@snowroute-tracker.iam.gserviceaccount.com

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Deploy to Firebase Hosting (live channel)
        working-directory: ${{ env.FIREBASE_STAGE }}
        run: |
          set -euo pipefail
          npx -y firebase-tools@"$FIREBASE_TOOLS_VERSION" deploy \
            --only hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive \
            --message "Manual deploy of ${GITHUB_SHA} (workflow_dispatch, run ${GITHUB_RUN_ID})"

      - name: Verify the live Firebase page matches the staged build
        run: |
          set -euo pipefail
          expected=$(cat "$FIREBASE_STAGE/expected-index.sha256")
          echo "Expected index.html sha256: $expected"
          for attempt in 1 2 3 4 5 6; do
            actual=$(curl -fsSL "https://snowroute-tracker.web.app/?run=${GITHUB_RUN_ID}" | sha256sum | awk '{print $1}') || actual=""
            if [ "$actual" = "$expected" ]; then
              echo "Verified: live Firebase index.html matches the staged build."
              exit 0
            fi
            echo "Attempt $attempt: live hash not matching yet - waiting 20s."
            sleep 20
          done
          echo "Live Firebase page did not match the staged build after deploy."
          exit 1

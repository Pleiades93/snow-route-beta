# B3 lifecycle trace (2026-11-09, Andrew-approved measurement job) -
# branch-only workflow: runs the three diagnostic drives directly so
# their full stdout (TRACE snapshot lines + result blocks) lands in the
# job logs. These drives are NOT part of the battery: they are absent
# from run.mjs ALL and from every shard list, and this file never merges
# to main.
name: b3-trace
on:
  push:
    branches: [b3-lifecycle-trace]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Locate Chrome
        run: echo "CHROME_BIN=$(command -v google-chrome || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"
      - name: "Trace driveT1 (G1)"
        run: node tests/browser/driveT1.mjs
      - name: "Trace driveT2 (G2 city supersede)"
        if: always()
        run: node tests/browser/driveT2.mjs
      - name: "Trace driveT3 (G2 search-tap supersede + G1 no-grid)"
        if: always()
        run: node tests/browser/driveT3.mjs

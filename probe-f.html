<!DOCTYPE html>
<!-- TEMPORARY PROBE (Option 3) — Andrew's design, approved 2026-11-09.
     Tests ONE treatment: the icon and title stay OUT of the iOS
     launch-handoff window. The frozen launch stills for this page are
     PLAIN BLUE (launch-o3-*.png, no icon, no title) and the live scene
     opens on blue + falling snow alone; the icon fades in at 1.25 s and
     the rest of the 1.159 opening choreography follows, shifted.
     Replica of the Beta 1.159 opening scene (splash blue #2b4bf2,
     one-canvas "Falls and settles" snow with parts/brand-snow.js
     parameters, icon 168 px / radius 38 / soft shadow, title 37 px with
     the 26 px gap, the 1.3 s FLIP rise to the +72 landing slot
     calc(21% + 51px), Choose a route solid / Create new route
     translucent). Buttons are inert — there is no app behind this page.
     DELETE after Andrew's verdict (with the launch-o3-*.png stills). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Snow Probe</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-startup-image" href="assets/launch/launch-o3-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="assets/launch/launch-o3-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="assets/launch/launch-o3-1260x2736.png" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="assets/launch/launch-o3-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="assets/launch/launch-o3-1080x2340.png" media="(device-width: 360px) and (device-height: 780px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="assets/launch/launch-o3-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="assets/launch/launch-o3-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="assets/launch/launch-o3-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="assets/launch/launch-o3-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="assets/launch/launch-o3-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="assets/launch/launch-o3-1242x2208.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="assets/launch/launch-o3-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Snow Probe">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2b4bf2">
<style>
  :root { --ease-open: cubic-bezier(.22,.9,.28,1); }
  html, body { height: 100%; height: 100dvh; margin: 0; overflow: hidden; font-family: -apple-system, sans-serif; background: #2b4bf2; overscroll-behavior: none; }
  /* the splash layer: blue, the one snow canvas, the brand (icon + mirror) */
  #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #2b4bf2; }
  #snowCv { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #splashBrand { position: relative; display: flex; flex-direction: column; align-items: center; opacity: 0; transition: opacity .35s ease; }
  #splashBrand.in { opacity: 1; }
  #splashBrand.out { opacity: 0; transition: opacity .3s ease; }
  #splashIcon { position: relative; width: 168px; height: 168px; border-radius: 38px; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
  #brandMirror { margin-top: 26px; font-size: 37px; font-weight: 700; letter-spacing: .2px; visibility: hidden; }
  /* the title layer: spans the scene, never reparented (the 1.155 pattern) */
  #brandLayer { position: fixed; inset: 0; z-index: 10001; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  #brandSpacer { width: 168px; height: 168px; flex: none; visibility: hidden; }
  #splashTitle { position: relative; margin-top: 26px; color: #fff; font-size: 37px; font-weight: 700; letter-spacing: .2px; opacity: 0; white-space: nowrap; }
  #splashTitle.play { animation: splashSlide .65s cubic-bezier(.16,.84,.3,1) forwards; }
  @keyframes splashSlide { 0% { opacity: 0; transform: translateX(360px); } 55% { opacity: 1; } 82% { transform: translateX(-9px); } 100% { opacity: 1; transform: translateX(0); } }
  #brandLayer.menu { display: block; }
  #brandLayer.menu > #splashTitle { position: absolute; top: calc(21% + 51px); left: 0; right: 0; margin-top: 0; text-align: center; }
  /* the menu: transparent over the splash layer so the one snow field paints through */
  #routeMenu { position: fixed; inset: 0; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: transparent; opacity: 0; visibility: hidden; transform: translateX(-26px); transition: opacity .5s var(--ease-open) .15s, transform .5s var(--ease-open) .15s, visibility 0s linear .15s; pointer-events: none; }
  #routeMenu.show { opacity: 1; visibility: visible; transform: none; }
  #rmMain { display: flex; flex-direction: column; gap: 12px; width: min(330px, calc(100vw - 48px)); opacity: 0; visibility: hidden; transform: translateY(14px); }
  #routeMenu.show #rmMain { opacity: 1; visibility: visible; transform: none; transition: opacity .5s ease .55s, transform .5s cubic-bezier(.22,1,.36,1) .55s, visibility 0s linear .55s; }
  .rmBtn { appearance: none; -webkit-appearance: none; border: none; background: rgba(255,255,255,.16); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.75); color: #fff; font-family: inherit; font-size: 19px; font-weight: 650; padding: 18px 20px; border-radius: 14px; text-align: center; width: 100%; box-sizing: border-box; }
  .rmBtn.primary { background: #fff; color: #173a8a; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
  /* reduced motion: the static landed menu — no snow, no animation */
  body.reduced #splashBrand { display: none; }
  body.reduced #routeMenu { transition: none; }
  body.reduced #rmMain { transition: none; }
</style>
</head>
<body>
<div id="splash"><canvas id="snowCv" aria-hidden="true"></canvas><div id="splashBrand"><img id="splashIcon" src="icon-512.png" alt=""><div id="brandMirror" aria-hidden="true">Snow Route</div></div></div>
<div id="brandLayer"><div id="brandSpacer"></div><div id="splashTitle">Snow Route</div></div>
<div id="routeMenu"><div class="rmPane" id="rmMain"><button class="rmBtn primary" type="button">Choose a route</button><button class="rmBtn" type="button">Create new route</button></div></div>
<script>
(function () {
  var brand = document.getElementById('splashBrand');
  var layer = document.getElementById('brandLayer');
  var title = document.getElementById('splashTitle');
  var menu = document.getElementById('routeMenu');
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduced) {
    // static landed menu: title in its slot, pills up, no snow, no motion
    document.body.classList.add('reduced');
    title.style.opacity = '1';
    layer.classList.add('menu');
    menu.classList.add('show');
    return;
  }

  /* ---- the one snow canvas: "Falls and settles", parameters identical
     to parts/brand-snow.js (Beta 1.158/1.159) ---- */
  var cvS = document.getElementById('snowCv');
  var ctxS = cvS.getContext('2d');
  var CFG = { count: 85, rMin: 1.1, rMax: 3.6, vMin: 34, vMax: 72, swayAmp: 7, swaySpeed: 0.7, alpha: 0.9 };
  function rand(a, b) { return a + Math.random() * (b - a); }
  var W = 0, H = 0, flakes = [], clock = 0, lastTs = 0;
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    var oW = W, oH = H;
    W = window.innerWidth; H = window.innerHeight;
    cvS.width = Math.round(W * dpr); cvS.height = Math.round(H * dpr);
    ctxS.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (oW > 0 && oH > 0 && flakes.length && (W !== oW || H !== oH)) { var sx = W / oW, sy = H / oH; for (var i = 0; i < flakes.length; i++) { flakes[i].bx *= sx; flakes[i].y *= sy; } }
  }
  function newFlake(scatter) {
    return { bx: rand(0, W), y: scatter ? rand(-4, H) : -4, r: rand(CFG.rMin, CFG.rMax), v: rand(CFG.vMin, CFG.vMax), phase: rand(0, Math.PI * 2), swayFreq: CFG.swaySpeed * rand(0.7, 1.3), amp: CFG.swayAmp * rand(0.5, 1.2), o: rand(0.55, 1), age: scatter ? rand(0.6, 3) : 0 };
  }
  function settleAmount() {
    var t = clock % 16;
    if (t < 9) { var u = t / 9; return 1 - Math.pow(1 - u, 3); }
    if (t < 12) return 1;
    if (t < 15) return 1 - (t - 12) / 3;
    return 0;
  }
  function groundHeightAt(x, amount) {
    var maxH = 20 * amount;
    if (maxH <= 0) return 0;
    return maxH * (0.72 + 0.16 * Math.sin(x * 0.045 + 1.7) + 0.12 * Math.sin(x * 0.013 + 0.4));
  }
  function render(amount) {
    var ctx = ctxS;
    ctx.clearRect(0, 0, W, H);
    if (amount > 0) {
      var grad = ctx.createLinearGradient(0, H - 22, 0, H);
      grad.addColorStop(0, 'rgba(255,255,255,0.92)');
      grad.addColorStop(1, 'rgba(235,244,255,0.98)');
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (var x = 0; x <= W; x += 6) ctx.lineTo(x, H - groundHeightAt(x, amount));
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.globalAlpha = Math.min(1, amount * 1.4);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = '#ffffff';
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      var fx = f.bx + Math.sin(clock * f.swayFreq + f.phase) * f.amp;
      ctx.globalAlpha = CFG.alpha * f.o * Math.min(1, f.age / 0.6);
      ctx.beginPath();
      ctx.arc(fx, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function loop(ts) {
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.05, (ts - lastTs) / 1000); // rAF halts while hidden; the clamp keeps the resume jump-free
    lastTs = ts;
    clock += dt;
    var amount = settleAmount();
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      f.age += dt;
      f.y += f.v * dt;
      if (f.y >= H - groundHeightAt(f.bx, amount) - f.r) flakes[i] = newFlake(false);
    }
    render(amount);
    window.requestAnimationFrame(loop);
  }
  resize();
  for (var i = 0; i < CFG.count; i++) flakes.push(newFlake(true));
  var rzT = 0;
  window.addEventListener('resize', function () { window.clearTimeout(rzT); rzT = window.setTimeout(resize, 150); });
  window.requestAnimationFrame(loop);

  /* ---- OPTION-3 TIMING ----
     0.00 s  blue + snow only. The icon's and title's boxes exist
             (opacity 0) so nothing shifts when they arrive — but
             neither is PAINTED during the launch-handoff window.
     1.25 s  the icon fades in (~0.35 s) at the splash pose.
     1.50 s  the title slides in beneath it (the current splashSlide).
     2.70 s  the flip: the brand fades (0.3 s), the title FLIPs up over
             1.3 s to the +72 menu slot, the pills fade in beneath. */
  window.setTimeout(function () { brand.classList.add('in'); }, 1250);
  window.setTimeout(function () { title.classList.add('play'); }, 1500);
  window.setTimeout(function () {
    brand.classList.add('out');
    menu.classList.add('show');
    title.style.animation = 'none';
    title.style.opacity = '1';
    var r1 = title.getBoundingClientRect();
    layer.classList.add('menu');
    var r2 = title.getBoundingClientRect();
    var dy = r1.top - r2.top;
    title.style.transition = 'none';
    title.style.transform = 'translateY(' + dy + 'px)';
    window.requestAnimationFrame(function () {
      window.requestAnimationFrame(function () {
        title.style.transition = 'transform 1.3s cubic-bezier(.65,0,.35,1)';
        title.style.transform = 'translateY(0px)';
      });
    });
  }, 2700);
})();
</script>
</body>
</html>
